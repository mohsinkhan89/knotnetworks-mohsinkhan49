<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350">
  <defs>
    <clipPath id="circleClip1">
      <circle cx="160" cy="180" r="130"/>
    </clipPath>
    <clipPath id="circleClip2">
      <circle cx="330" cy="130" r="90"/>
    </clipPath>
  </defs>

  <!-- Circle 1 Photo Frame -->
  <circle cx="160" cy="180" r="135" fill="#00D2B5" opacity="0.3"/>
  <g clip-path="url(#circleClip1)">
    <rect x="30" y="50" width="260" height="260" fill="#1E293B"/>
    <text x="160" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#00F5D4" text-anchor="middle">OFFICE WORKSPACE</text>
    <text x="160" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="12" fill="#94A3B8" text-anchor="middle">Collaborative &amp; Inclusive</text>
  </g>

  <!-- Circle 2 Photo Frame -->
  <circle cx="330" cy="130" r="95" fill="#7C3AED" opacity="0.3"/>
  <g clip-path="url(#circleClip2)">
    <rect x="240" y="40" width="180" height="180" fill="#3B82F6"/>
    <text x="330" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">TEAM CELEBRATIONS</text>
  </g>
</svg>
