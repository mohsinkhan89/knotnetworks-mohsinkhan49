<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" rx="16" fill="#1E1B4B"/>
  <!-- Event photo representation -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="150" cy="130" r="20"/><rect x="130" y="160" width="40" height="60" rx="8"/>
    <circle cx="210" cy="120" r="22"/><rect x="188" y="152" width="44" height="70" rx="8"/>
    <circle cx="270" cy="115" r="24"/><rect x="244" y="149" width="52" height="75" rx="8"/>
    <circle cx="330" cy="120" r="22"/><rect x="308" y="152" width="44" height="70" rx="8"/>
    <circle cx="380" cy="130" r="20"/><rect x="360" y="160" width="40" height="60" rx="8"/>
  </g>
  <!-- Overlay Gradient -->
  <rect width="500" height="300" rx="16" fill="url(#eventGrad)" opacity="0.3"/>
  <!-- Play Button Overlay -->
  <circle cx="250" cy="150" r="36" fill="rgba(0, 210, 181, 0.9)" shadow="0 6px 16px rgba(0,0,0,0.3)"/>
  <polygon points="244,136 264,150 244,164" fill="#FFFFFF"/>
</svg>
