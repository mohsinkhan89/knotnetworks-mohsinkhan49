<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <radialGradient id="circleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EBF7FD"/>
      <stop offset="100%" stop-color="#D5EEFD"/>
    </radialGradient>
  </defs>
  <!-- Background Light Sphere -->
  <circle cx="250" cy="200" r="170" fill="url(#circleBg)"/>
  <circle cx="250" cy="200" r="160" fill="none" stroke="#00D2B5" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Center AceCloud Logo Emblem -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#FFFFFF" shadow="0 8px 20px rgba(0,0,0,0.06)"/>
    <path d="M 25 45 L 38 22 L 51 45 Z" fill="#00D2B5"/>
    <path d="M 40 45 L 53 22 L 66 45 Z" fill="#FF5A5F"/>
    <path d="M 55 45 L 68 22 L 81 45 Z" fill="#F8B600"/>
    <text x="90" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#1A1B4B">ace</text>
    <text x="135" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#444">cloud</text>
  </g>

  <!-- Server Stack Icon (Left Floating) -->
  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="60" height="75" rx="8" fill="#1E293B"/>
    <rect x="8" y="10" width="44" height="12" rx="3" fill="#00D2B5"/>
    <rect x="8" y="30" width="44" height="12" rx="3" fill="#334155"/>
    <rect x="8" y="50" width="44" height="12" rx="3" fill="#334155"/>
    <circle cx="44" cy="16" r="2.5" fill="#FFFFFF"/>
    <circle cx="44" cy="36" r="2.5" fill="#00D2B5"/>
    <circle cx="44" cy="56" r="2.5" fill="#00D2B5"/>
  </g>

  <!-- Cloud Floating Icon (Bottom Left) -->
  <g transform="translate(130, 270)">
    <rect x="0" y="0" width="65" height="50" rx="12" fill="#1E293B"/>
    <path d="M22 34 h20 a10 10 0 0 0 0 -20 a12 12 0 0 0 -22 -4 a8 8 0 0 0 -6 14 z" fill="#00D2B5"/>
  </g>

  <!-- Shield Security Floating Icon (Right Floating) -->
  <g transform="translate(350, 220)">
    <circle cx="30" cy="30" r="30" fill="#0066FF"/>
    <path d="M30 15 L42 21 V30 C42 38 35 44 30 46 C25 44 18 38 18 30 V21 L30 15 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M26 30 L29 33 L35 27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
