<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350">
  <defs>
    <clipPath id="leadClip">
      <rect width="420" height="320" rx="30" ry="30"/>
    </clipPath>
    <linearGradient id="leadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <path d="M 0 40 Q 0 0 40 0 L 380 0 Q 420 0 420 40 L 420 280 Q 420 320 380 320 L 40 320 Q 0 320 0 280 Z" fill="#2563EB" opacity="0.2" transform="translate(20, 20)"/>
  
  <g clip-path="url(#leadClip)" transform="translate(10, 10)">
    <rect width="420" height="320" fill="url(#leadBg)"/>
    <!-- Simulated Leaders Photo -->
    <!-- Male Leader -->
    <g transform="translate(130, 70)">
      <circle cx="45" cy="45" r="35" fill="#475569"/>
      <path d="M5 130 C 5 85, 85 85, 85 130 Z" fill="#1E293B"/>
      <!-- Tie -->
      <path d="M41 85 L49 85 L47 115 L45 120 L43 115 Z" fill="#EF4444"/>
    </g>
    <!-- Female Leader -->
    <g transform="translate(240, 90)">
      <circle cx="40" cy="40" r="32" fill="#64748B"/>
      <path d="M0 130 C 0 85, 80 85, 80 130 Z" fill="#7E22CE"/>
    </g>
    <rect x="20" y="250" width="380" height="50" rx="10" fill="rgba(15, 23, 42, 0.75)"/>
    <text x="210" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">RTDS LEADERSHIP TEAM</text>
  </g>
</svg>
